	window.lang = new jquery_lang_js();
	$().ready(function() {
		window.lang.run();
		
		// Some Android devices won't show a decimal separator (. or ,) when using a html input type=number. Using type=tel is an (ugly) workaround

}
	});

var lang_short = getBrowserLanguage();

    <form name="qtc_form" id="qtc_form" action="#" method="post">
      <fieldset data-role="controlgroup" id="qtc_radio" data-type="horizontal" >
        <input type="radio" name="qtc_radio" id="qtc_radio_hf" value="hf" checked="checked" />

        <input type="radio" name="qtc_radio" id="qtc_radio_rr" value="rr"  />
        <label for="qtc_radio_rr"><span lang="en">Intervalo-RR</span></label>
      </fieldset>
 <table class="resultTableSmall">
<colgroup>
<col class="resultTableLabel">
<col>
</colgroup>
<tr><td>
          <label for="qtc_qt"><span lang="en">QT</span></label>
</td><td>
          <input type="number"  placeholder="msec" onKeyUp="qtc_calc()" maxlength="3"  name="qtc_qt" id="qtc_qt" value=""  />
</td></tr><tr id="tablerow_hf"><td>
          <label for="qtc_hf"><span lang="en">FC</span></label>
</td><td>
          <input type="number" placeholder="bpm" onKeyUp="qtc_calc()" maxlength="3"  name="qtc_hf"  id="qtc_hf" value="" />
</td></tr><tr id="tablerow_rr"style="display:none; visibility:hidden;" ><td>
          <label for="qtc_rr"><span lang="en">RR</span></label>
</td><td>
          <input type="number"  placeholder="msec"  onKeyUp="qtc_calc()" maxlength="4" name="qtc_rr" disabled="disabled" id="qtc_rr"  value="" />
</td></tr></table>
<div class="resultDiv">
          <span lang="en">QTc (msec)</span>:
          <div id="qtc_qtc" style="font-weight:bold"></div>
</div>
