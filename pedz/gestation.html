<script type="text/javascript">
function changeLanguage() {
	window.lang = new jquery_lang_js();
	$().ready(function() {
		window.lang.run();
		
		// Some Android devices won't show a decimal separator (. or ,) when using a html input type=number. Using type=tel is an (ugly) workaround
		if (agent.search('android') > -1) {
$('input[type=number]').each(function() { $(this).prop('type', 'tel'); });
}
	});

var lang_short = getBrowserLanguage();
if (lang_short == 'de')
		window.lang.change('de');
else if (lang_short == 'es')
	window.lang.change('es');
}




</script>

   <div data-role="header" data-theme="a">
<h1 lang="en">Idade Gestacional</h1>
  </div>
  <div data-role="content" data-theme="a" >
    <div class="bodyWrapper">
      <form name="gestation_form" id="gestation_form" action="#" method="post">
        <div id="dateInputMobile">
          <div class="pedzDate">
            <label  for="gestation_estimated"><span lang="en">Data de Interesse (calculada)</span></label>
            <input name="gestation_estimated" id="gestation_estimated">
          </div>
          <div class="pedzDate">
            <label for="gestation_actual" ><span lang="en">Data de Interesse (atual)</span></label>
            <input name="gestation_actual" id="gestation_actual"  >
          </div>
        </div>
        <div id="dateInputDesktop">
          <div class="pedzDate">
            <label  for="gestation_estimated"><span lang="en">Data de Interesse (calculada)</span></label>
            <div class="pedZDateInput">
              <input type="text" maxlength="2"  name="gestation_date_estimated_d" id="gestation_estimated_d" value="" placeholder="DD" />
            </div>
            <div class="pedZDateInput">
              <input type="text" maxlength="2"  name="gestation_date_estimated_m" id="gestation_estimated_m" value=""  placeholder="MM"/>
            </div>
            <div class="pedZDateInput">
              <input type="text" maxlength="4"  name="gestation_date_estimated_y" id="gestation_estimated_y" value="" placeholder="YYYY" />
            </div>
          </div>
          <div class="pedzDate">
            <label for="gestation_actual" ><span lang="en">Data de Interesse (atual)</span></label>
            <div class="pedZDateInput">
              <input type="text" maxlength="2"  name="gestation_date_actual_d" id="gestation_actual_d" value="" placeholder="DD" />
            </div>
            <div class="pedZDateInput">
              <input type="text" maxlength="2"  name="gestation_date_actual_m" id="gestation_actual_m" value="" placeholder="MM" />
            </div>
            <div class="pedZDateInput">
              <input type="text" maxlength="4"  name="gestation_date_actual_y" id="gestation_actual_y" value="" placeholder="YYYY"/>
            </div>
          </div>
        </div>
        <div id="headerResult"><span lang="en">Idade Gestacional</span>:
          <div id="gestation_result"></div>
        </div>
        <div data-role="collapsible" data-mini="true" data-content-theme="d" class="ui-mini">
          <h3><span lang="en">Opções</span></h3>
          <div class="bmi_flip_div">
            <label for="dateInput_flip"><span lang="en">Método de data</span></label>
            <select name="dateInput_flip" id="dateInput_flip" data-mini="true"  data-role="flipswitch" data-wrapper-class="custom-size-flipswitch">
              <option value="desktop" lang="en">Desktop</option>
              <option value="mobile" lang="en">Celular</option>
            </select>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div data-role="footer" class="ui-bar"  data-theme="a">
    <div class="ui-grid-b">
      <div class="ui-block-a"></div>
      <div class="ui-block-b"></div>
         <div class="ui-block-c"> <a href="#info" data-rel="popup" data-position-to="window" class="ui-btn ui-corner-all ui-shadow ui-btn-inline ui-icon-info ui-btn-icon-left">Info</a></div>
      <div data-role="popup" id="info" style="max-width:400px;">
        <div data-role="header">
          <h1>Info</h1>
        </div>
        <div role="main" class="ui-content">
          <p><span lang="en">Calcula a Idade Gestacional pela Data Atual e a Data de Interesse</span></p>
          <a href="#" class="ui-btn ui-corner-all ui-shadow ui-mini ui-icon-delete ui-btn-icon-left" data-mini="true" data-rel="back"><span lang="en">Fechar</span></a></div>
      </div>
    </div>
  </div>
</div>
